 catch(x){alert('無法播放這個檔案，請改用 MP3 或 M4A');}};

function tp(e){const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;touch={x:(t.clientX-r.left)/r.width*W,y:(t.clientY-r.top)/r.height*H};}
cv.addEventListener('touchstart',e=>{e.preventDefault();tp(e);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();tp(e);},{passive:false});
cv.addEventListener('touchend',()=>touch=null);
cv.addEventListener('mousedown',e=>{tp(e);cv.onmousemove=tp;});
addEventListener('mouseup',()=>{touch=null;cv.onmousemove=null;});
requestAnimationFrame(loop);
